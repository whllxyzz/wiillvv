<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NALWA — 6 Juni 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a; --border:rgba(255, 120, 160, 0.4); --text:#ffffff; --accent:#ff99cc}

body{
    background: url('https://i.ibb.co.com/fGFZStYM/10414642883962226.jpg') no-repeat center center fixed;
    background-size: cover;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
}

/* Wrapper utama - tidak pakai blur, hanya sebagai pembatas */
.wrap{
    max-width:680px;
    margin:0 auto;
    padding:60px 24px 100px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
}

/* KUPU-KUPU FIXED - tidak ikut scroll */
.butterfly-fixed {
    position: fixed;
    right: 5%;
    top: 22%;
    width: clamp(80px, 15vw, 130px);
    height: auto;
    pointer-events: none;
    z-index: 10;
    filter: drop-shadow(0 2px 6px rgba(255,105,180,0.3));
    animation: float 4s ease-in-out infinite, wingFlap 3s infinite;
}

@keyframes float {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
    100% { transform: translateY(0px) rotate(0deg); }
}
@keyframes wingFlap {
    0% { transform: scaleX(1); }
    50% { transform: scaleX(0.96); }
    100% { transform: scaleX(1); }
}

@media (max-width: 640px) {
    .butterfly-fixed { right: 2%; top: 15%; width: 65px; }
}
@media (min-width: 1200px) {
    .butterfly-fixed { right: 12%; top: 20%; width: 140px; }
}

/* HEADER - glassmorphism transparan */
.header{
    text-align:center;
    padding:40px 20px 36px;
    margin-bottom: 20px;
    background: rgba(255, 220, 240, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 32px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.label{font-size:11px;letter-spacing:4px;color:#ffc0e0;text-transform:uppercase;margin-bottom:20px;text-shadow:0 0 6px #ff66aa;font-weight:500}
.name{font-family:'Playfair Display',serif;font-size:clamp(52px,12vw,88px);font-weight:700;line-height:.95;letter-spacing:-2px;color:#fff;text-shadow:0 0 12px #ff66aa, 0 2px 4px rgba(255,105,180,0.5);}
.name em{font-style:italic;color:var(--accent);text-shadow:0 0 10px #ff99cc;}
.date-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:24px;font-size:13px;color:#ffe0f0;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 5px #ff66aa;}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px #ff99cc;}

/* Countdown - glassmorphism transparan */
.countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:40px 0;
}
.countdown-item{
    background: rgba(255, 220, 240, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 20px 8px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.3s ease;
    animation: borderPulse 2s infinite ease-in-out;
}
@keyframes borderPulse {
    0% { border-color: rgba(255, 153, 204, 0.4); box-shadow: 0 0 0px rgba(255,153,204,0);}
    50% { border-color: rgba(255, 153, 204, 0.9); box-shadow: 0 0 12px rgba(255,153,204,0.5);}
    100% { border-color: rgba(255, 153, 204, 0.4); box-shadow: 0 0 0px rgba(255,153,204,0);}
}
.cc-n{font-family:'Playfair Display',serif;font-size:clamp(36px,8vw,52px);font-weight:800;line-height:1;color:#fff;display:block;text-shadow:0 0 10px #ff66aa;}
.cc-l{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#ffe0f0;margin-top:8px;display:block;text-shadow:0 0 5px #ff66aa;font-weight:500;}

/* Progress section - glassmorphism */
.prog-section{
    padding:24px 20px;
    background: rgba(255, 220, 240, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 28px;
    margin: 30px 0;
    border: 1px solid rgba(255,255,255,0.2);
}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:#fff;letter-spacing:1px;margin-bottom:12px;text-shadow:0 0 4px #ff66aa;}
.prog-track{height:5px;background:rgba(255,200,220,0.7);border-radius:10px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);width:0%;transition:width 1s cubic-bezier(0.2, 0.9, 0.4, 1.1);position:relative;box-shadow:0 0 6px #ff99cc;border-radius:10px;}
.prog-fill::after{
    content:'';
    position:absolute;
    top:0;
    right:0;
    bottom:0;
    width:40px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
    0% { transform: translateX(-100%);}
    100% { transform: translateX(400%);}
}
.wib{font-size:12px;color:#ffe0f0;letter-spacing:1.5px;margin-top:14px;text-align:right;text-shadow:0 0 4px #ff66aa;}

/* Lagu favorit section - glassmorphism */
.section{
    padding: 32px 20px;
    background: rgba(255, 220, 240, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 28px;
    margin: 30px 0;
    border: 1px solid rgba(255,255,255,0.2);
}
.sec-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#ffc0e0;margin-bottom:24px;text-align:center;text-shadow:0 0 4px #ff66aa;}

.footer{
    text-align:center;
    margin-top: 40px;
    padding: 20px;
    font-size:11px;
    color:#ffc0e0;
    letter-spacing:2px;
    text-transform:uppercase;
    text-shadow:0 0 4px #ff66aa;
    background: rgba(255, 220, 240, 0.3);
    backdrop-filter: blur(6px);
    border-radius: 40px;
}
</style>
</head>
<body>

<img class="butterfly-fixed" src="https://i.ibb.co.com/k2kGr47W/Pink-Butterfly-Aesthetic-Background-removebg-preview.png" alt="Kupu-kupu pink">

<div class="wrap">
  <div class="header">
    <div class="label">Birthday Countdown</div>
    <div class="name">NAL<em>WA</em></div>
    <div class="date-row">
      <span>Sabtu</span><div class="dot-sep"></div>
      <span>6 Juni 2026</span><div class="dot-sep"></div>
      <span>Gemini ♊</span>
    </div>
  </div>

  <div class="countdown">
    <div class="countdown-item"><span class="cc-n" id="cd">--</span><span class="cc-l">Hari</span></div>
    <div class="countdown-item"><span class="cc-n" id="ch">--</span><span class="cc-l">Jam</span></div>
    <div class="countdown-item"><span class="cc-n" id="cm">--</span><span class="cc-l">Menit</span></div>
    <div class="countdown-item"><span class="cc-n" id="cs">--</span><span class="cc-l">Detik</span></div>
  </div>

  <div class="prog-section">
    <div class="prog-meta"><span>1 Jan 2026</span><span id="ppct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    <div class="wib" id="wib">WIB --:--:--</div>
  </div>

  <div class="section">
    <div class="sec-label">Lagu Favorit</div>
    <div style="margin-top: 20px;">
       <iframe style="border-radius:16px" src="https://open.spotify.com/embed/track/7gqdZpe7MlTLA59viClLoY?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </div>

  <div class="footer">NALWA — 6 Juni 2026</div>
</div>

<script>
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  const now=new Date();
  const wib=new Date(now.getTime()+7*3600000);
  document.getElementById('wib').textContent=`WIB ${pad(wib.getUTCHours())}:${pad(wib.getUTCMinutes())}:${pad(wib.getUTCSeconds())}`;
  const nowWIB = new Date(now.getTime() + 7*3600000);
  const targetWIB = new Date(Date.UTC(2026, 5, 6, 0, 0, 0));
  const diff = targetWIB - nowWIB;
  const t = Math.floor(diff/1000);
  if(t>=0){
    document.getElementById('cd').textContent=pad(Math.floor(t/86400));
    document.getElementById('ch').textContent=pad(Math.floor((t%86400)/3600));
    document.getElementById('cm').textContent=pad(Math.floor((t%3600)/60));
    document.getElementById('cs').textContent=pad(t%60);
  } else {
    document.getElementById('cd').textContent="00";
    document.getElementById('ch').textContent="00";
    document.getElementById('cm').textContent="00";
    document.getElementById('cs').textContent="00";
  }
  const start=new Date(2026,0,1);
  const range=targetWIB-start;
  const nowMS = nowWIB;
  let pct = ((nowMS - start) / range) * 100;
  pct = Math.min(100, Math.max(0, pct));
  document.getElementById('pf').style.width=pct.toFixed(2)+'%';
  document.getElementById('ppct').textContent=pct.toFixed(1)+'%';
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
